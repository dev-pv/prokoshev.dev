user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
	worker_connections 1024;
}
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        ssl_certificate     /etc/letsencrypt/live/prokoshev.dev/fullchain3.pem;
        ssl_certificate_key /etc/letsencrypt/live/prokoshev.dev/privkey3.pem;
        server_name prokoshev.dev;

        location / {
            proxy_pass http://web:8000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location /static/ {
            alias /app/static/;
        }
    }
    server {
        listen 443 ssl http2;
        ssl_certificate     /etc/letsencrypt/live/prokoshev.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/prokoshev.dev/privkey.pem;
        server_name *.prokoshev.dev;

        location / {
            proxy_pass http://web:8000;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $host;
            proxy_redirect off;
        }
        location /static/ {
            alias /app/static/;
        }
    }
}
